        @import url('https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap');

        :root {
            --nav-text-color: rgb(203, 203, 203);
        }


        * {
            margin: 0;
            padding: 0;
            list-style-type: none;
            font-family: "Rubik", sans-serif;
            font-weight: 450;
        }

        html, body {
            width: 100%;
            height: auto;
            min-height: 100vh;
            background: rgb(19, 19, 19);
        }

        .screensizewarn {
            display: none;
            justify-content: center;
            align-items: center;
            background: black;
            color: white;
            z-index: 9999;
            width: 100%;
            height: 100vh;
            text-align: center;
            font-style: italic;
            font-weight: 100;
            font-size: 15px;
        }

        nav {
            margin-bottom: 100px;
            position: relative;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: 100%;
            height: 100px;
            color: rgb(55, 55, 55);
            font-size: 17px;
            font-weight: 700;

            & li {
                cursor: pointer;
                user-select: none;
            }

            & ul[data-main] {
                position: absolute;
                left: 5vw;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: row;
                gap: 35px;

                & img {
                    background-position: center;
                    background-size: 100%;
                    background-repeat: no-repeat;
                    width: 130px;
                    height: 80px;
                    border: none;
                    outline: none;
                    display: block;
                }

                & li {
                    transition: 0.2s;
                }

                & li[data-selected] {
                    color: var(--nav-text-color);
                    position: relative;

                    &::after {
                        content: '';
                        width: 100%;
                        height: 1.5px;
                        background: var(--nav-text-color);
                        position: absolute;
                        bottom: -10px;
                        left: 0;
                    }
                }

                & li:hover {
                    color: var(--nav-text-color);
                }   
            }
            & ul[data-signup] {
                z-index: 1;

                & li {
                    background: rgb(57, 56, 56);
                    color: white;
                    border-radius: 100vh;
                    width: 80px;
                    text-align: center;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    height: 20px;
                    padding: 10px;
                    font-size: 15px;
                    position: absolute;
                    right: 5vw;
                    transform: translateY(-20px);
                    border: rgb(181, 181, 181) 2px solid;
                    box-shadow: 0 0 1px rgb(255, 255, 255);
                }
            }
        }

        main {
            position: absolute;
            left: calc(5% - 2.5rem);
            width: calc(90% + 5em);

            & .games {
                border-radius: 5px;
                display: grid;
                grid-template-columns: repeat(auto-fit, 200px);
                grid-auto-rows: 1fr;
                gap: 1em;
                padding-top: 2em;
                padding-bottom: 2em;
                margin-bottom: 4em;
                justify-content: center;
                align-content: center;
                justify-items: center;
                align-items: center;
                border: none;
                background-image: url('./img/background.png');

                & > card {
                    cursor: pointer;
                    user-select: none;
                    backdrop-filter: blur(10px);
                    text-align: center;
                    background: rgba(255, 255, 255, 0.4);
                    height: 200px;
                    width: 200px;
                    overflow: hidden;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    align-content: center;
                    justify-content: center;
                    border: 1px black solid;
                    border-radius: 5px;
                }
            }
        }

        @media (max-width: 800px) {
            body > * {
                display: none;
            }

            .screensizewarn {
                display: flex;
            }
        }

        @media (max-width: 1000px) {
            ul[data-signup] {
                display: none;
            }
        }
    </style>
</head>

        function analyzeFilters(data) {
        const blocked = data.results
            .filter(r => r.blocked === true)
            .map(r => r.name);
